<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSO One — Theme Assets</title>

  <style>
    /* CSS Custom Properties for Light (Default) and Dark Themes */
    :root {
      --sso-navy: #092c58;
      --sso-navy-dark: #061f3d;
      --sso-coral: #f25d5a;
      --sso-coral-dark: #dc4d4a;
      
      --sso-blue-soft: #eef5fb;
      --surface: #ffffff;
      --surface-hover: #fcfdff;
      --background: #f5f8fc;
      --border: #dce5ef;
      --border-hover: #c7d7e7;
      --text: #172b3f;
      --muted: #66788a;
      --shadow: 0 8px 24px rgba(9, 44, 88, 0.08);
      
      --logo-light-display: block;
      --logo-dark-display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sso-blue-soft: #172b45;
        --surface: #0e1a29;
        --surface-hover: #132236;
        --background: #070e17;
        --border: #1e344d;
        --border-hover: #2a4768;
        --text: #e1e9f5;
        --muted: #8b9eb3;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

        --logo-light-display: none;
        --logo-dark-display: block;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 90% 0%, rgba(242, 93, 90, 0.08), transparent 28rem),
        linear-gradient(180deg, var(--background) 0%, var(--background) 100%);
    }

    .topbar {
      background: var(--sso-navy);
      border-bottom: 4px solid var(--sso-coral);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .topbar-inner {
      max-width: 980px;
      min-height: 82px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .brand svg {
      width: auto;
      max-width: 190px;
      height: 38px;
    }

    /* Switch SVGs based on Light / Dark mode */
    .brand .logo-light {
      display: var(--logo-light-display);
    }

    .brand .logo-dark {
      display: var(--logo-dark-display);
    }

    .badge {
      color: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 42px 28px 60px;
    }

    .intro {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--sso-coral);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.4px;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .subtitle {
      max-width: 650px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .themes {
      display: grid;
      gap: 14px;
    }

    .theme {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .theme:hover {
      border-color: var(--border-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    .theme.open {
      border-color: rgba(242, 93, 90, 0.55);
    }

    .theme-header {
      width: 100%;
      min-height: 70px;
      padding: 16px 20px;
      border: 0;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      text-align: left;
    }

    .theme-header:hover {
      background: var(--surface-hover);
    }

    .theme-header:focus-visible {
      outline: 3px solid rgba(242, 93, 90, 0.4);
      outline-offset: -3px;
    }

    .theme-name {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .theme-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--sso-blue-soft);
      color: var(--sso-coral);
      font-size: 15px;
      font-weight: 800;
    }

    .theme.open .theme-icon {
      background: rgba(242, 93, 90, 0.15);
      color: var(--sso-coral);
    }

    .chevron {
      color: var(--sso-coral);
      font-size: 13px;
      transition: transform 0.2s ease;
    }

    .theme.open .chevron {
      transform: rotate(90deg);
    }

    .asset-list {
      display: none;
      margin: 0;
      padding: 0 20px 18px 69px;
      list-style: none;
      border-top: 1px solid var(--border);
    }

    .theme.open .asset-list {
      display: block;
    }

    .asset-list li {
      margin: 7px 0;
    }

    .asset-list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .asset-list a::before {
      content: "↗";
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--sso-blue-soft);
      color: var(--sso-coral);
      font-size: 13px;
      font-weight: 800;
    }

    .asset-list a:hover {
      background: var(--sso-blue-soft);
      color: var(--sso-coral-dark);
    }

    .asset-list a:hover::before {
      background: rgba(242, 93, 90, 0.2);
    }

    .empty {
      padding: 16px 0 4px;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }

    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 28px 28px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .topbar-inner {
        min-height: 70px;
        padding: 14px 18px;
      }

      .brand svg {
        max-width: 145px;
        height: 30px;
      }

      .badge {
        display: none;
      }

      .container {
        padding: 30px 16px 45px;
      }

      .asset-list {
        padding-left: 20px;
      }

      .theme-header {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

    <div class="topbar-inner">
      <div class="brand">

  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">SSO One</p>
      <h1>Theme Assets</h1>
      <p class="subtitle">
        Browse themes and open their associated assets. Click a theme to expand
        its asset collection.
      </p>
    </section>

    <section id="themes" class="themes"></section>
  </main>

  <footer>
    SSO One · Asset Browser
  </footer>

  <script>
    const themes = [
      {
        name: "BRAC Bank PLC",
        assets: [
          { name: "Logo", url: "bbl/logo.svg" },
          { name: "Theme CSS", url: "bbl/custom.css" },
          { name: "Icons", url: "bbl/favicon.ico" }
        ]
      },
      {
        name: "Trust Bank PLC",
        assets: [
          { name: "Logo", url: "tbl/logo.svg" },
          { name: "Theme CSS", url: "tbl/custom.css" },
          { name: "Icons", url: "tbl/favicon.ico" }
        ]
      },
      {
        name: "Eastern Banl PLC",
         assets: [
          { name: "Logo", url: "ebl/logo.svg" },
          { name: "Theme CSS", url: "ebl/custom.css" },
          { name: "Icons", url: "ebl/favicon.ico" }
        ]
      }
    ];

    const themesContainer = document.getElementById("themes");

    function renderThemes() {
      themesContainer.innerHTML = "";

      themes.forEach((theme, index) => {
        const themeElement = document.createElement("section");
        themeElement.className = "theme";

        const header = document.createElement("button");
        header.className = "theme-header";
        header.type = "button";
        header.setAttribute("aria-expanded", "false");
        header.setAttribute("aria-controls", `theme-assets-${index}`);

        const themeName = document.createElement("span");
        themeName.className = "theme-name";

        const icon = document.createElement("span");
        icon.className = "theme-icon";
        icon.textContent = "T";

        const name = document.createElement("span");
        name.textContent = theme.name;

        const chevron = document.createElement("span");
        chevron.className = "chevron";
        chevron.textContent = "▶";

        themeName.appendChild(icon);
        themeName.appendChild(name);
        header.appendChild(themeName);
        header.appendChild(chevron);

        const assetList = document.createElement("ul");
        assetList.className = "asset-list";
        assetList.id = `theme-assets-${index}`;

        if (!theme.assets || theme.assets.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No assets available";
          assetList.appendChild(li);
        } else {
          theme.assets.forEach(asset => {
            const li = document.createElement("li");
            const link = document.createElement("a");

            link.href = "themes/realms/" + asset.url;
            link.textContent = asset.name;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            li.appendChild(link);
            assetList.appendChild(li);
          });
        }

        header.addEventListener("click", () => {
          const isOpen = themeElement.classList.toggle("open");
          header.setAttribute("aria-expanded", String(isOpen));
        });

        themeElement.appendChild(header);
        themeElement.appendChild(assetList);
        themesContainer.appendChild(themeElement);
      });
    }

    renderThemes();
  </script>
</body>
</html>
